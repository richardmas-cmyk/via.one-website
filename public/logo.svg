<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Green gradient for swoosh -->
        <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3CB371;stop-opacity:1" />
        </linearGradient>
        <!-- Circular swirl gradients -->
        <linearGradient id="greenBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3CB371;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4169E1;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="orangeYellow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="blueGreen" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#20B2AA;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Green dots above "via" -->
    <circle cx="18" cy="12" r="4" fill="#3CB371"/>
    <circle cx="32" cy="8" r="6" fill="#3CB371"/>

    <!-- "via" text -->
    <text x="5" y="55" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1a237e">
        via
    </text>

    <!-- Green swoosh under "via" -->
    <path d="M 5 60 Q 40 72 85 55" stroke="url(#swooshGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Colorful circular swirl -->
    <g transform="translate(115, 40)">
        <!-- Blue-green arc -->
        <path d="M 0 -22 A 22 22 0 0 1 19 11" stroke="url(#blueGreen)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <!-- Orange arc -->
        <path d="M 19 11 A 22 22 0 0 1 -19 11" stroke="url(#orangeYellow)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <!-- Green arc -->
        <path d="M -19 11 A 22 22 0 0 1 0 -22" stroke="url(#greenBlue)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <!-- Center dot -->
        <circle cx="0" cy="0" r="4" fill="#3CB371"/>
    </g>

    <!-- ".one" text -->
    <text x="145" y="55" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1a237e">
        .one
    </text>
</svg>
